<div class="page-header">
  <h2 class="h4 mb-0">New center</h2>
  <a routerLink="/centers" class="btn btn-outline-secondary">Back to list</a>
</div>

<div class="card">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Center name *</label>
          <input
            id="name"
            class="form-control"
            formControlName="name"
            [class.is-invalid]="invalid('name')"
          />
          @if (invalid('name')) {
            <div class="invalid-feedback">Center name is required.</div>
          }
        </div>

        <div class="col-md-6">
          <label class="form-label" for="username">Login username *</label>
          <input
            id="username"
            class="form-control"
            formControlName="username"
            [class.is-invalid]="invalid('username')"
          />
          @if (invalid('username')) {
            <div class="invalid-feedback">Username is required.</div>
          }
        </div>

        <div class="col-md-6">
          <label class="form-label" for="password">Password *</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="new-password"
            [class.is-invalid]="invalid('password')"
          />
          @if (invalid('password')) {
            <div class="invalid-feedback">Minimum 8 characters.</div>
          }
        </div>

        <div class="col-md-6">
          <label class="form-label" for="confirmPassword">Confirm password *</label>
          <input
            id="confirmPassword"
            type="password"
            class="form-control"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [class.is-invalid]="confirmInvalid()"
          />
          @if (confirmInvalid()) {
            <div class="invalid-feedback">Passwords do not match.</div>
          }
        </div>

        <div class="col-md-6">
          <label class="form-label" for="fullName">Contact full name</label>
          <input id="fullName" class="form-control" formControlName="fullName" />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="phoneNumber">Phone</label>
          <input id="phoneNumber" class="form-control" formControlName="phoneNumber" placeholder="01012345678" />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="invalid('email')"
          />
          @if (invalid('email')) {
            <div class="invalid-feedback">Enter a valid email address.</div>
          }
        </div>

        <div class="col-md-6">
          <label class="form-label" for="languagePreference">Center app language</label>
          <select id="languagePreference" class="form-select" formControlName="languagePreference">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 pt-4">
        <a routerLink="/centers" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="submitting()">
          {{ submitting() ? 'Creating…' : 'Create center' }}
        </button>
      </div>
    </form>
  </div>
</div>
